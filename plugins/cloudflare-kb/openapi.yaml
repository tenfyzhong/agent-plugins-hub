openapi: 3.1.0
info:
  title: Cloudflare Knowledge Base Search API
  description: Semantic search API powered by Cloudflare Workers AI and Vectorize.
  version: 0.1.0
servers:
  - url: https://cf-kb-api.workers.dev
paths:
  /search:
    post:
      summary: Search Knowledge Base
      description: Perform semantic similarity search over personal documents and notes.
      operationId: searchKnowledgeBase
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: The search query or concept to look up in the knowledge base.
                topK:
                  type: integer
                  default: 5
                  description: Maximum number of search results to return.
                source:
                  type: string
                  description: Optional source filter (e.g. 'obsidian-notes', 'blog').
              required:
                - query
      responses:
        '200':
          description: Successful search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        score:
                          type: number
                        text:
                          type: string
                        source:
                          type: string
                        path:
                          type: string
                        title:
                          type: string
                        chunkIndex:
                          type: integer
                        url:
                          type: string
                      required:
                        - id
                        - score
                        - text
                        - source
                        - path
                        - chunkIndex
                required:
                  - query
                  - count
                  - results
        '401':
          description: 'Unauthorized: Missing or invalid API token'
        '400':
          description: 'Bad Request: Invalid query format'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
